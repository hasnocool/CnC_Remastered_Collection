[package]
name = "cnc-replayer"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nvgithub/cnc-remastered"

[dependencies]
cnc-core = { path = "../cnc-core" }
cnc-tiberian-dawn = { path = "../cnc-tiberian-dawn" }
cnc-red-alert = { path = "../cnc-red-alert" }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
thiserror = "1.0"

[dev-dependencies]
pretty_assertions = "1.4"
